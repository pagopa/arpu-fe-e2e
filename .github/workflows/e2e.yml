name: e2e test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5' # Run every weekday at 9am
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '22.21.0'

jobs:
  testing-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install dependecies
        run: yarn install --immutable

      - name: Install playwright browsers
        run: yarn playwright install chromium firefox webkit

      - name: Install playwright deps
        run: yarn playwright install-deps 

      - name: populate environment vars writing down an .env file
        run: |
          touch .env
          echo BASE_URL=https://uat.p4pa.pagopa.it >> .env
          echo USER_USERNAME=${{ secrets.USER_USERNAME_UAT }} >> .env
          echo USER_PASSWORD=${{ secrets.USER_PASSWORD_UAT }} >> .env
          cat .env

      - name: run e2e tests
        run: yarn test

      - name: Sanitize Playwright report
        if: always()
        run: |
          find playwright-report -name '*.zip' | while read trace_file; do
            mkdir -p temp_trace
            unzip -q "$trace_file" -d temp_trace
            echo "Sanitizing trace file: $trace_file"
            sed -i 's/Bearer eyJ[A-Za-z0-9_.-]*/Bearer [REDACTED]/g' temp_trace/*.network || true
            (cd temp_trace && zip -q -r "../$trace_file" .)
            rm -rf temp_trace
          done

      - name: Generate Playwright report
        if: always()
        run: | 
          mkdir -p public/reports/${{ github.run_id }}/
          cp -r playwright-report/* public/reports/${{ github.run_id }}/
          echo "Playwright report generated at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"

      - name: Generate an index page with links to all reports
        if: always()
        continue-on-error: true
        run: |
          git fetch origin gh-pages:gh-pages || true
          git worktree add -f existing-reports gh-pages || true
  
          if [ -d "existing-reports/reports" ]; then
            cp -r existing-reports/reports/* public/reports/ || true
          fi

          cd public/reports
          REPORT_LIST=""
          for d in $(ls -1d */ 2>/dev/null | sed 's:/$::' | grep -E '^[0-9]+$' | sort -nr); do
            REPORT_LIST="${REPORT_LIST}<li><a href='./reports/${d}/'>Report Run #${d}</a></li>"
          done
          cd ../..

          cat << EOF > public/index.html
          <!DOCTYPE html>
          <html lang="it">
          <head>
            <meta charset="UTF-8">
            <title>Storico Test E2E ARPU</title>
          </head>
          <body>
            <h1>Storico Test E2E ARPU</h1>
            <ul>
              ${REPORT_LIST}
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Playwright report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1
        with:
          publish_dir: ./public
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true